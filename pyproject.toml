[project]
name = "barrio-bot"
version = "0.1.0"
description = "MVP local de citas y pedidos con aislamiento PostgreSQL"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "jinja2>=3.1,<4",
  "cryptography>=50,<51",
  "typer>=0.15,<1",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
bot = "app.cli:main"
sim = "app.cli:sim_main"
seed = "app.cli:seed_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
